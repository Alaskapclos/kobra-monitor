name: Checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  tests:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.11', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-lock.txt
      - run: python -m unittest discover -s tests -v
      - run: python vendor/kobra-bridge/test_read_only.py
      - run: node --check static/monitor.js
      - run: node --check static/setup.js
      - run: node tests/test_timeline_render.js
      - run: node tests/test_archive_render.js
      - run: python scripts/release_check.py
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker compose up --build -d --wait
      - run: curl --fail http://127.0.0.1:7125/health
      - name: Test full backup and restore with read-only source volume
        run: |
          docker compose exec -T monitor python -c 'from configuration import save_config; save_config("/data", ["192.168.1.20"])'
          docker compose exec -T monitor python -c 'from accounts import write_account; write_account("/data", "CI-Fixture", "Fixture-only-passphrase-2026!")'
          monitor_container_id="$(docker compose ps -q monitor)"
          docker run --rm --network none --read-only --no-healthcheck \
            --volumes-from "$monitor_container_id:ro" \
            --tmpfs /snapshots:uid=10001,gid=10001,mode=0700,size=64m \
            --tmpfs /tmp:mode=1777,size=64m \
            kobra-monitor:0.9.0-alpha.1 sh -c '
              python backup.py create --data-dir /data --destination /snapshots --image kobra-monitor:0.9.0-alpha.1 &&
              python backup.py restore /snapshots/*.zip --target /tmp/restored &&
              python -c "from pathlib import Path; from configuration import load_config; assert load_config(\"/tmp/restored\")==[\"192.168.1.20\"]; assert Path(\"/data/access-token\").read_bytes()==Path(\"/tmp/restored/access-token\").read_bytes(); assert Path(\"/data/account.json\").read_bytes()==Path(\"/tmp/restored/account.json\").read_bytes(); print(\"Backup restore verified without printer connections.\")"
            '
      - name: Export tested NAS image
        run: docker image save -o kobra-monitor-linux-amd64.tar kobra-monitor:0.9.0-alpha.1
      - uses: actions/upload-artifact@v4
        with:
          name: kobra-monitor-linux-amd64
          path: kobra-monitor-linux-amd64.tar
          retention-days: 7
      - if: always()
        run: docker compose down
