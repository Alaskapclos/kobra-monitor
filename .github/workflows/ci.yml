name: Checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  tests:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.11', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-lock.txt
      - run: python -m unittest discover -s tests -v
      - run: python vendor/kobra-bridge/test_read_only.py
      - run: node --check static/monitor.js
      - run: node --check static/setup.js
      - run: node tests/test_timeline_render.js
      - run: node tests/test_archive_render.js
      - run: python scripts/release_check.py
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker compose up --build -d --wait
      - run: curl --fail http://127.0.0.1:7125/health
      - name: Export tested NAS image
        run: docker image save -o kobra-monitor-linux-amd64.tar kobra-monitor:0.7.0-alpha.1
      - uses: actions/upload-artifact@v4
        with:
          name: kobra-monitor-linux-amd64
          path: kobra-monitor-linux-amd64.tar
          retention-days: 7
      - if: always()
        run: docker compose down
