# Import the matching linux/amd64 image in UGOS Docker before deployment.
services:
  monitor:
    image: kobra-monitor:0.24.0-alpha.1
    platform: linux/amd64
    restart: unless-stopped
    init: true
    environment:
      KOBRA_SPEED_CONTROL_IPS: "${KOBRA_SPEED_CONTROL_IPS:-}"
      KOBRA_FAN_CONTROL_IPS: "${KOBRA_FAN_CONTROL_IPS:-}"
      KOBRA_LIGHT_CONTROL_IPS: "${KOBRA_LIGHT_CONTROL_IPS:-}"
    ports:
      - "${KOBRA_BIND_ADDRESS:?Setze die private NAS-IP in der Projektkonfiguration}:7125:7125"
    volumes:
      - monitor-data:/data
    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
volumes:
  monitor-data:
